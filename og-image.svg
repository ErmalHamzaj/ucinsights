  <text x="754" y="338" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#4b5563">SYMPTOM TREND — LAST 7 DAYS</text>
  <rect x="760" y="380" width="32" height="28" rx="4" fill="#2563eb" opacity="0.5"/>
  <rect x="800" y="360" width="32" height="48" rx="4" fill="#2563eb" opacity="0.6"/>
  <rect x="840" y="345" width="32" height="63" rx="4" fill="#2563eb" opacity="0.7"/>
  <rect x="880" y="368" width="32" height="40" rx="4" fill="#2563eb" opacity="0.6"/>
  <rect x="920" y="340" width="32" height="68" rx="4" fill="#3b82f6"/>
  <rect x="960" y="355" width="32" height="53" rx="4" fill="#2563eb" opacity="0.7"/>
  <rect x="1000" y="372" width="32" height="36" rx="4" fill="#2563eb" opacity="0.5"/>
  <line x1="754" y1="408" x2="1050" y2="408" stroke="#1e2a4a" stroke-width="1"/>

  <!-- AI insight card -->
  <rect x="754" y="420" width="364" height="64" rx="12" fill="#0c1a3e" stroke="#1e3a8a" stroke-width="1"/>
  <circle cx="778" cy="452" r="8" fill="#2563eb"/>
  <circle cx="778" cy="452" r="4" fill="#1d4ed8" opacity="0" />
  <text x="795" y="446" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#60a5fa">AI INSIGHT</text>
  <text x="795" y="464" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9ca3b8">Coffee may be triggering your flares.</text>

  <!-- Bottom tab bar mockup -->
  <rect x="738" y="510" width="396" height="60" rx="0" fill="#0d1520"/>
  <rect x="738" y="510" width="396" height="60" rx="28" fill="#0d1520"/>
  <rect x="738" y="510" width="396" height="30" fill="#0d1520"/>
  <text x="810" y="545" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">Home</text>
  <text x="876" y="545" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Track</text>
  <text x="942" y="545" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Meds</text>
  <text x="1008" y="545" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Profile</text>
  <line x1="798" y1="512" x2="822" y2="512" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
