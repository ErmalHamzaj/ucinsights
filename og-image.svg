  <text x="103" y="550" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#10b981" text-anchor="middle">FREE</text>
  <rect x="154" y="530" width="120" height="30" rx="15" fill="#1e1b4b"/>
  <text x="214" y="550" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#a5b4fc" text-anchor="middle">No credit card</text>
  <rect x="286" y="530" width="110" height="30" rx="15" fill="#0c1a3e"/>
  <text x="341" y="550" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#93c5fd" text-anchor="middle">100% Private</text>

