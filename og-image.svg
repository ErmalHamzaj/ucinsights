  <rect x="64" y="456" width="164" height="42" rx="21" fill="#1e3a8a"/>
  <rect x="64" y="456" width="164" height="42" rx="21" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="146" y="482" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#93c5fd" text-anchor="middle">📊  Daily Tracker</text>

  <rect x="244" y="456" width="192" height="42" rx="21" fill="#2e1065"/>
  <rect x="244" y="456" width="192" height="42" rx="21" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="340" y="482" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#c4b5fd" text-anchor="middle">🔮  Flare Prediction</text>

  <rect x="452" y="456" width="172" height="42" rx="21" fill="#064e3b"/>
  <rect x="452" y="456" width="172" height="42" rx="21" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="538" y="482" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6ee7b7" text-anchor="middle">💬  AI Assistant</text>

