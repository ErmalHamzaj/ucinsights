  <rect x="70" y="65" width="12" height="22" rx="2" fill="white"/>
  <rect x="65" y="70" width="22" height="12" rx="2" fill="white"/>
  <!-- Brand text -->
  <text x="120" y="70" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="white">UCInsights</text>
  <text x="120" y="93" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6b7280">Free · AI-powered · Ulcerative Colitis Management</text>

  <!-- ── Main headline ──────────────────────────────── -->
  <text x="64" y="194" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700" fill="white">Take control of your</text>
  <text x="64" y="262" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700" fill="#60a5fa">Ulcerative Colitis</text>
  <text x="64" y="330" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700" fill="white">journey.</text>

  <!-- ── Subtitle ───────────────────────────────────── -->
  <text x="64" y="384" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#9ca3b8">Track symptoms · Predict flares 48h early · Log medications</text>
  <text x="64" y="412" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#9ca3b8">Based on 15,600+ patient experiences.</text>

