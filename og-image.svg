  <rect x="754" y="130" width="364" height="88" rx="14" fill="#1e3a8a" opacity="0.5"/>
  <text x="936" y="163" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">TODAY'S FLARE RISK</text>
  <text x="936" y="198" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#34d399" text-anchor="middle">LOW</text>

  <!-- Stats row -->
  <rect x="754" y="232" width="174" height="72" rx="12" fill="#131929" stroke="#1e2a4a" stroke-width="1"/>
  <text x="841" y="258" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">SYMPTOMS</text>
  <text x="841" y="288" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#60a5fa" text-anchor="middle">2/5</text>

  <rect x="944" y="232" width="174" height="72" rx="12" fill="#131929" stroke="#1e2a4a" stroke-width="1"/>
  <text x="1031" y="258" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">MEDS TAKEN</text>
  <text x="1031" y="290" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#10b981" text-anchor="middle">✓ Done</text>

