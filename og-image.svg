<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f1221"/>
  <!-- Subtle blue glow top-right -->
  <circle cx="1080" cy="80" r="320" fill="#2563eb" opacity="0.07"/>
  <!-- Purple glow bottom-left -->
  <circle cx="160" cy="560" r="260" fill="#7c3aed" opacity="0.06"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="630" fill="#2563eb"/>

  <!-- ── Brand ─────────────────────────────────────── -->
