  <rect x="876" y="28" width="120" height="22" rx="11" fill="#0f1221"/>
  <!-- Screen -->
  <rect x="738" y="66" width="396" height="504" rx="28" fill="#0d1117"/>

  <!-- Nav bar in mockup -->
  <rect x="738" y="66" width="396" height="50" rx="0" fill="#131929"/>
  <rect x="738" y="66" width="396" height="50" rx="28" fill="#131929"/>
  <rect x="738" y="88" width="396" height="28" fill="#131929"/>
  <text x="936" y="97" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#60a5fa" text-anchor="middle">UCInsights</text>

